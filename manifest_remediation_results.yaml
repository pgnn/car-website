  - file: "k8s/values.yaml"
    reason: "Contains Harness expression values for image and imageTag. Updated to include a namespace variable resolved from the infrastructure definition."

changes_applied:
  - file: "k8s/deployment.yaml"
    change: "Added a Namespace resource at the top of the manifest file"
    before: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: car-website
      ...
    after: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ .Values.namespace | default "car-website" }}
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: car-website
      ...
    rationale: >
      By including a Namespace resource in the manifest, Kubernetes will
      create the namespace if it does not already exist before applying the
      Deployment and Service. The namespace name is parameterized via
      values.yaml and defaults to 'car-website' for backward compatibility.
      Harness applies multi-document manifests in resource-kind order,
      processing Namespace resources before Deployments and Services.

  - file: "k8s/values.yaml"
    change: "Added namespace variable using Harness infrastructure expression"
    before: |
      image: <+artifacts.primary.image>
      imageTag: <+pipeline.sequenceId>
    after: |
      image: <+artifacts.primary.image>
      imageTag: <+pipeline.sequenceId>
      namespace: <+infra.namespace>
    rationale: >
      The namespace value is resolved from the Harness infrastructure
      definition at deploy time via <+infra.namespace>. This ensures the
      Namespace resource name matches the target namespace configured in
      each infrastructure definition (e.g. 'car-website-clone-repo' for
      South_k8s_infra, 'car-website' for Nordics_k8s_infra).

