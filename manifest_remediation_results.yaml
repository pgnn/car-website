execution_url: "https://app.harness.io/ng/#/account/EeRjnXTnS4GrLG5VNNJZUw/ci/orgs/sandbox/projects/Phuong_Sandbox_v2/pipelines/Kubernetes_Remediation/executions/uNonQOjPSxO13OKptQYsXw/pipeline"

analysis:
  failed_stage: "Deploy"
  failed_step: "Stage Deployment"
  failed_step_type: "K8sBlueGreenDeploy"
  failure_type: "ConfigMap not found"
  root_cause: >
    The Deployment in k8s/deployment.yaml references a non-existent ConfigMap
    'car-website-config-that-does-not-exist' as a volume. When Kubernetes attempts
    to create the container, it fails with CreateContainerConfigError because the
    ConfigMap does not exist in the cluster or in the manifests. The application
    (server.js) does not read from /config and does not require a ConfigMap volume.
    This was introduced in commit 52a6b33.
  confidence: "high"
  evidence:
    - "k8s/deployment.yaml line 29: configMap name set to 'car-website-config-that-does-not-exist'"
    - "No ConfigMap resource named 'car-website-config-that-does-not-exist' exists in k8s/ manifests"
    - "The application (server.js) does not read from /config and does not require a ConfigMap volume"
    - "Harness service CarApp uses k8s/deployment.yaml as K8sManifest with k8s/values.yaml for value overrides"
    - "Pipeline car-website-pipeline uses K8sBlueGreenDeploy step type to deploy this manifest"

correlated_files:
  - file: "k8s/deployment.yaml"
    reason: "Contains the Deployment and Service specs; the Deployment had a volume referencing the non-existent ConfigMap"
  - file: "k8s/values.yaml"
    reason: "Contains the image and imageTag values used by the Deployment template; currently correct"
  - file: "server.js"
    reason: "Application entry point; confirmed it does not read from /config or require any ConfigMap"
  - file: "Dockerfile"
    reason: "Container build definition; confirmed no /config directory is created or expected"

changes_applied:
  - file: "k8s/deployment.yaml"
    change: "Removed volumeMount and volume referencing non-existent ConfigMap"
    before: |
      containers:
        - name: car-website
          image: "{{ .Values.image }}"
          ports:
            - containerPort: 3000
          env:
            - name: CAR_VERSION
              value: "{{ .Values.imageTag }}"
          volumeMounts:
            - name: app-config
              mountPath: /config
      volumes:
        - name: app-config
          configMap:
            name: car-website-config-that-does-not-exist
    after: |
      containers:
        - name: car-website
          image: "{{ .Values.image }}"
          ports:
            - containerPort: 3000
          env:
            - name: CAR_VERSION
              value: "{{ .Values.imageTag }}"
    rationale: >
      The ConfigMap 'car-website-config-that-does-not-exist' does not exist in the cluster
      or in the manifests. Referencing it causes CreateContainerConfigError during pod
      scheduling. The application does not require a /config volume mount. Removing the
      volume and volumeMount restores the working deployment state.

validation:
  commands_run:
    - "git diff k8s/"
    - "python3 YAML syntax validation on deployment.yaml"
    - "python3 YAML syntax validation on values.yaml"
  results:
    - "deployment.yaml: valid YAML - volumeMount and volume sections removed cleanly"
    - "values.yaml: valid YAML - imageTag correctly uses Harness expression <+pipeline.sequenceId>"
    - "git diff confirms only the non-existent ConfigMap volume reference was removed"

pull_request:
  created: true
  url: "https://github.com/pgnn/car-website/pull/8"
  branch: "harness/manifest-remediation-9419"

next_steps:
  - "Review and merge the pull request to restore working Kubernetes manifests"
  - "Re-run the car-website-pipeline after merge to verify K8sBlueGreenDeploy succeeds"
  - "If a ConfigMap volume is actually needed, create the ConfigMap resource in the k8s/ manifests and re-add the volume with the correct name"
  - "Consider closing PR #7 (harness/manifest-remediation-1v9s) which contains the same fix from a previous remediation run"
